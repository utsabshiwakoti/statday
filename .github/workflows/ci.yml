name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # A real Postgres, so the concurrent usage-counting test runs too.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: statday_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/statday_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -v

  # The SDK is generated code: regenerate it and fail if it differs from what's committed,
  # then run the example script against a real server.
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt openapi-python-client==0.30.0 ruff==0.17.4
      - name: Regenerate and compare
        working-directory: sdk
        run: |
          openapi-python-client generate --path openapi.json --config config.yml --output-path python --overwrite
          git diff --exit-code -- python
      - name: Run the example against the API
        run: |
          pip install ./sdk/python
          (cd backend && uvicorn app.main:app --port 8000 &)
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          STATDAY_URL=http://localhost:8000 python sdk/example.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
